appId: com.deadlockmodmanager.app
productName: Deadlock Mod Manager
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: deadlock-manager
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
# Su Linux l'architettura predefinita è x64. Gli strumenti che servono a rpm, pacman e flatpak
# vengono installati dal workflow di release.
linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
    - snap
    - flatpak
  maintainer: NightHvnter
  category: Utility
  # il file .desktop prende il nome da desktopName in package.json, che Electron usa anche come
  # app_id / WM_CLASS: così il desktop associa le finestre aperte all'icona dell'app
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
# I valori predefiniti di electron-builder (20.08) sono fuori supporto da anni
flatpak:
  runtimeVersion: '24.08'
  baseVersion: '24.08'
npmRebuild: false
# Gli installer vengono caricati in una bozza di GitHub Release (workflow .github/workflows/release.yml)
publish:
  provider: github
  owner: NightHvnter
  repo: DeadlockModManager
  releaseType: draft
