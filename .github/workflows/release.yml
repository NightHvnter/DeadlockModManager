# Compila Deadlock Mod Manager per Windows, macOS e Linux e carica gli installer in una bozza di
# GitHub Release. Parte quando si pubblica un tag di versione, ad esempio:
#   git tag v1.0.0 && git push origin v1.0.0
# Il tag deve coincidere con "version" in deadlock-manager/package.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  # La bozza viene creata una sola volta, prima delle build: se ogni build la cercasse e la
  # creasse da sé, partendo insieme ne creerebbero una a testa per lo stesso tag.
  release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./deadlock-manager/package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version ($version)"
            exit 1
          fi

      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # le bozze non si trovano cercando per tag: si cercano nell'elenco delle release
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$existing" = "0" ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG"
          else
            echo "A release for $TAG already exists, reusing it"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: deadlock-manager
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deadlock-manager/package-lock.json

      # Strumenti per i pacchetti Linux: rpm (rpmbuild), pacman (bsdtar), flatpak (flatpak-builder
      # e il repository Flathub da cui electron-builder scarica runtime ed Electron BaseApp).
      # AppImage, deb e snap non richiedono altro.
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Package and upload to the draft release
        if: matrix.target != 'linux'
        run: npx electron-builder --${{ matrix.target }} --publish always

      # Su Linux lo snap si crea a parte: electron-builder pubblica sempre gli snap sullo Snap Store
      # (che richiede snapcraft e un account), mai su GitHub. Lo si crea senza pubblicarlo e lo si
      # carica nella bozza con gh.
      - name: Package and upload to the draft release (Linux)
        if: matrix.target == 'linux'
        run: |
          npx electron-builder --linux AppImage deb rpm pacman flatpak --publish always
          npx electron-builder --linux snap --publish never
          gh release upload "$TAG" dist/*.snap --clobber
